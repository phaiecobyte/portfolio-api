version: '3.8'
name: portfolio

services:
  postgres:
    image: postgres:16
    container_name: portfolio-db
    environment:
      POSTGRES_USER: phaiecobyte
      POSTGRES_PASSWORD: phaiecobyte@123
      POSTGRES_DB: portfolio_db
    ports:
      - "5433:5432"
    volumes:
      - portfolio_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: portfolio-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: phaiecobyte
      MINIO_ROOT_PASSWORD: phaiecobyte@123
    command: server /data --console-address ":9001"
    volumes:
      - portfolio_minio_data:/data

volumes:
  portfolio_data:
  portfolio_minio_data: